name: PredigtFinder YouTube Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  youtube-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: YouTube-Werkzeug installieren
        run: python -m pip install --upgrade yt-dlp

      - name: YouTube-Kanal pruefen
        run: |
          yt-dlp --flat-playlist --ignore-errors --no-warnings \
            --print "%(id)s	%(title)s" \
            "https://www.youtube.com/@frankwernet/videos" \
            > youtube_sync_aktuell.txt
          echo "Gefundene Videos:"
          wc -l < youtube_sync_aktuell.txt

      - name: Predigtvideos abgleichen
        run: python youtube_sync_github.py

      - name: Testdatei zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: videolinks-sync-test
          path: videolinks_sync_test.json

      - name: Neue Videolinks veroeffentlichen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          alt = json.loads(Path("videolinks.json").read_text(encoding="utf-8-sig"))
          neu = json.loads(Path("videolinks_sync_test.json").read_text(encoding="utf-8-sig"))

          for name, url in alt.items():
              if neu.get(name) != url:
                  if not (
                      url.startswith("https://1drv.ms/")
                      and neu.get(name, "").startswith("https://www.youtube.com/watch?v=")
                  ):
                      raise SystemExit("SICHERHEITSSTOPP: Bestehender Link unerwartet veraendert.")

          if neu != alt:
              Path("videolinks.json").write_text(
                  json.dumps(neu, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Neue Videolinks zur Veroeffentlichung vorbereitet.")
          else:
              print("Keine neuen Videolinks vorhanden.")
          PY

          if git diff --quiet -- videolinks.json; then
            echo "Keine Veroeffentlichung erforderlich."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- videolinks.json
            git commit -m "YouTube-Videolinks automatisch aktualisieren"
            git push origin HEAD:main
          fi